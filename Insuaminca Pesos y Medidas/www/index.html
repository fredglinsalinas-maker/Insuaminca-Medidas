       * devtools interceptors, and automation scripts can assign to window.fetch
       * without throwing "TypeError: Cannot set property fetch of #<Window> which has only a getter".

          var originalFetch = window.fetch;
          var currentFetch = typeof originalFetch === 'function' ? originalFetch : null;

            configurable: true,
            enumerable: true,
            get: function () {

            ) {

              e.stopImmediatePropagation();

          function (e) {

            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }

          true
